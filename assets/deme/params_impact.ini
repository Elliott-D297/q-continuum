# Q-Continuum DEME parameters for impact: a bed settles, then a projectile strikes it and digs a crater.
# The driver reads this file each time it starts: change a value and run again, no rebuild.
# A comment "# Label | unit | help" describes the key on the line below it.

[Time]
# Simulated time | s
sim_time = 0.3
# Time step | s | Keep it below about a fifth of the Rayleigh time step (shown on the DEME page)
dt = 6e-6
# Frames per simulated second | 1/s
fps = 20
# Largest particle speed | m/s | DEME sizes its contact search by it: set it above the fastest particle
max_velocity = 20

[Gravity]
# Gravity | m/s² | 9.81 Earth, 1.62 Moon, 3.71 Mars
gravity = 1.62

[Particles]
# Smallest radius | m
radius_min = 0.001
# Largest radius | m | The same as the smallest for one size
radius_max = 0.002
# Size bins | | Sizes from the smallest to the largest, equal numbers of each
size_bins = 5
# Grain density | kg/m³
density = 3100
# Most particles | | The fill region is sampled, then cut to this many
max_particles = 40000

[Material]
# Young's modulus | Pa | DEM softens it to allow a larger time step: 1e7 to 1e9 is usual
youngs_modulus = 1e8
# Poisson's ratio | |
poisson_ratio = 0.3
# Restitution | | 0 dead, 1 perfectly elastic
restitution = 0.3
# Sliding friction | |
friction = 0.6
# Rolling friction | | Stands in for grain shape: angular grains 0.1 to 0.3
rolling_friction = 0.2

[Bed]
# Box width | m
box_width = 0.12
# Bed depth | m | Particles start in a layer this thick; it settles to about 40 % of that
bed_depth = 0.1
# Settling time | s | Before the impact; frames are written meanwhile
settle_time = 0.6

[Projectile]
# Projectile radius | m
projectile_radius = 0.006
# Projectile density | kg/m³ | Steel 7800, glass 2500
projectile_density = 7800
# Impact speed | m/s
impact_speed = 10
# Impact angle | ° | From the vertical
impact_angle = 0
